{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size:5rem; opacity:.15; font-weight:900; color:var(--primary); line-height:1;">404</div>
    <i class="fa-solid fa-map-location-dot fa-3x text-muted opacity-30 mb-3 mt-2"></i>
    <h4 class="fw-bold">Page Not Found</h4>
    <p class="text-muted mb-4">
        Sorry, the page you're looking for doesn't exist or has been moved.
    </p>
    <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
        <i class="fa-solid fa-house me-1"></i>Back to Dashboard
    </a>
</div>
{% endblock %}
