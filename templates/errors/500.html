{% extends "base.html" %}
{% block title %}Server Error{% endblock %}

{% block content %}
<div class="text-center py-5">
    <div style="font-size:5rem; opacity:.15; font-weight:900; color:var(--danger); line-height:1;">500</div>
    <i class="fa-solid fa-triangle-exclamation fa-3x text-danger opacity-40 mb-3 mt-2"></i>
    <h4 class="fw-bold">Something Went Wrong</h4>
    <p class="text-muted mb-4">
        An internal server error occurred. Our logs have recorded the issue.
        Please try again, or return to the dashboard.
    </p>
    <div class="d-flex gap-2 justify-content-center">
        <button onclick="history.back()" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i>Go Back
        </button>
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary">
            <i class="fa-solid fa-house me-1"></i>Dashboard
        </a>
    </div>
</div>
{% endblock %}
